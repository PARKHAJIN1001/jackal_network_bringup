# Jackal LAN time server. Only the NUC may query this host over the LAN.
# No "local stratum": an unsynchronised laptop must not pretend to have UTC.
server time.bora.net iburst minpoll 4 maxpoll 6
driftfile /var/lib/chrony/chrony.drift
rtcsync
makestep 0.1 3
# Use chrony's upstream default during initial frequency calibration. With a
# 100 ppm gate this laptop retained its 1,000,000 ppm initial uncertainty and
# the NUC repeatedly rejected its NTP root distance (2026-09-11 observation).
# This is NOT the ROS readiness threshold; verify offset/slew/root distance.
maxupdateskew 1000.0
leapsectz right/UTC
logdir /var/log/chrony

bindaddress 192.168.50.1
allow 192.168.50.2/32
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
