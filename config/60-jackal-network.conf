# Jackal LAN High-Bandwidth PointCloud UDP Tuning
# Prevents IP fragmentation drops on 430 kB PointCloud2 bursts
net.ipv4.ipfrag_high_thresh = 67108864
net.ipv4.ipfrag_low_thresh = 50331648
net.ipv4.ipfrag_time = 1
net.core.netdev_max_backlog = 10000
net.core.rmem_max = 33554432
net.core.rmem_default = 4194304
